<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BPMN Analyzer - Launcher</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  <script>
    // Ao clicar no ícone do app no Miro, abre o painel com a interface (app.html)
    miro.board.ui.on('icon:click', async () => {
      await miro.board.ui.openPanel({ url: 'app.html' });
    });
  </script>
</head>
<body></body>
</html>
